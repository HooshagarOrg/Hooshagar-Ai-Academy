name: Lighthouse

on:
  workflow_dispatch:
  schedule:
    # After E2E Nightly: 02:00 Tehran = 22:30 UTC
    - cron: '30 22 * * *'

concurrency:
  group: lighthouse
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    env:
      CI: true
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXTAUTH_URL: http://127.0.0.1:3000
      NEXTAUTH_SECRET: ci-placeholder-secret-minimum-32-chars
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      LHCI_BASE_URL: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (hooshagar-test)
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
          SUPABASE_SERVER_URL: ${{ secrets.SUPABASE_TEST_URL }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Missing GitHub Actions secrets SUPABASE_TEST_URL / SUPABASE_TEST_ANON_KEY / SUPABASE_TEST_SERVICE_ROLE_KEY (hooshagar-test only)"
            exit 1
          fi
          pnpm run build

      - name: Start production server
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
          SUPABASE_SERVER_URL: ${{ secrets.SUPABASE_TEST_URL }}
        run: |
          pnpm exec next start -H 127.0.0.1 -p 3000 > next-start.log 2>&1 &
          echo $! > next-start.pid
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:3000/api/ready | grep -q '"ready":true'; then
              echo "Server ready"
              exit 0
            fi
            sleep 2
          done
          echo "Server did not become ready within 3 minutes"
          cat next-start.log || true
          exit 1

      - name: Ensure LHCI login accounts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
          E2E_STUDENT_NUMBER: ${{ secrets.E2E_STUDENT_NUMBER }}
          E2E_STUDENT_PIN: ${{ secrets.E2E_STUDENT_PIN }}
          E2E_STAFF_USERNAME: ${{ secrets.E2E_STAFF_USERNAME }}
          E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}
        run: node scripts/perf/ensure-lhci-accounts.mjs

      - name: Lighthouse CI
        # Credentials come from ensure-lhci-accounts via GITHUB_ENV
        run: pnpm lhci

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Stop server
        if: always()
        run: |
          if [ -f next-start.pid ]; then
            kill "$(cat next-start.pid)" 2>/dev/null || true
          fi
          pkill -f "next start" 2>/dev/null || true
