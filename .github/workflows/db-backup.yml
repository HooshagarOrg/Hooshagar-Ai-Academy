name: Database Backup

on:
  schedule:
    # روزانه ساعت 01:30 UTC ≈ 05:00 تهران
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AWS CLI (for Arvan S3)
        run: |
          pip install --quiet awscli

      # Supabase hosted DB is Postgres 17; supabase CLI ships pg_dump 15 → version mismatch.
      # Use official postgres:17 client image for dump. Prefer Session pooler (port 5432) in SUPABASE_DB_URL.
      - name: Dump database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL}" ]; then
            echo "SUPABASE_DB_URL secret is missing"
            exit 1
          fi
          DATE=$(date -u +%Y-%m-%d)
          OUT="hooshagar-db-${DATE}.sql"
          # Redact password for diagnostics (host/user/port only)
          python3 - <<'PY'
          import os, urllib.parse
          u = urllib.parse.urlparse(os.environ["SUPABASE_DB_URL"])
          print(f"dump target host={u.hostname} port={u.port} user={u.username}")
          PY
          docker run --rm \
            -e DATABASE_URL="$SUPABASE_DB_URL" \
            -v "$PWD:/out" \
            postgres:17 \
            bash -c "pg_dump \"\$DATABASE_URL\" --no-owner --no-acl -f /out/${OUT}"
          gzip -9 "$OUT"
          ls -lh "${OUT}.gz"
          echo "BACKUP_FILE=${OUT}.gz" >> "$GITHUB_ENV"

      - name: Upload to Arvan S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARVAN_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARVAN_SECRET_KEY }}
          AWS_DEFAULT_REGION: default
          ARVAN_ENDPOINT: ${{ secrets.ARVAN_ENDPOINT }}
          ARVAN_BACKUP_BUCKET: ${{ secrets.ARVAN_BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          ENDPOINT="${ARVAN_ENDPOINT:-https://s3.ir-thr-at1.arvanstorage.ir}"
          BUCKET="${ARVAN_BACKUP_BUCKET:-hooshagar-backups}"
          KEY="db/${BACKUP_FILE}"
          aws --endpoint-url "$ENDPOINT" s3 cp "$BACKUP_FILE" "s3://${BUCKET}/${KEY}"
          echo "Uploaded s3://${BUCKET}/${KEY}"

      - name: Prune backups older than 60 days
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARVAN_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARVAN_SECRET_KEY }}
          AWS_DEFAULT_REGION: default
          ARVAN_ENDPOINT: ${{ secrets.ARVAN_ENDPOINT }}
          ARVAN_BACKUP_BUCKET: ${{ secrets.ARVAN_BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          ENDPOINT="${ARVAN_ENDPOINT:-https://s3.ir-thr-at1.arvanstorage.ir}"
          BUCKET="${ARVAN_BACKUP_BUCKET:-hooshagar-backups}"
          CUTOFF=$(date -u -d '60 days ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-60d +%Y-%m-%dT%H:%M:%SZ)
          aws --endpoint-url "$ENDPOINT" s3api list-objects-v2 --bucket "$BUCKET" --prefix "db/" \
            --query "Contents[?LastModified<='$CUTOFF'].Key" --output text | tr '\t' '\n' | while read -r key; do
              [ -z "$key" ] || [ "$key" = "None" ] && continue
              echo "Deleting old backup: $key"
              aws --endpoint-url "$ENDPOINT" s3 rm "s3://${BUCKET}/${key}"
            done
