name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      CI: true
      # مقادیر ساختگی فقط برای build در GitHub Actions (بدون وابستگی به Secrets)
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpLXBsYWNlaG9sZGVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE2NDAwMDAwMDAsImV4cCI6MTk1NTU3NjAwMH0.ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpLXBsYWNlaG9sZGVyIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTY0MDAwMDAwMCwiZXhwIjoxOTU1NTc2MDAwfQ.ci-placeholder

    steps:
      - uses: actions/checkout@v4

      # نسخه از package.json → packageManager خوانده می‌شود
      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run type-check

      - name: Build
        run: pnpm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NEXTAUTH_SECRET: ci-placeholder-secret-minimum-32-chars
          NEXTAUTH_URL: http://localhost:3000

      - name: Install k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: '0.54.0'

      - name: Validate k6 load scripts
        run: |
          k6 inspect scripts/load/smoke.js
          k6 inspect scripts/load/teacher.js
          k6 inspect scripts/load/parent.js
          k6 inspect scripts/load/student.js
          k6 inspect scripts/load/school-3000.js
          node --check scripts/load/school-3000-curl.mjs
        # بار واقعی روی staging: docs/CAPACITY_BASELINE.md

  security-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit (critical only)
        run: pnpm audit --audit-level critical
        continue-on-error: true
